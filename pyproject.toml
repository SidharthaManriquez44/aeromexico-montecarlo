[project]
name = "areomexico-montecarlo"
version = "0.1.0"
description = "Capacity decision for a hypothetical Aeroméxico route"
requires-python = ">=3.10"

dependencies = [

    "numpy==1.26.4",
    "pandas==2.2.3",
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "pytest",
]

[project.optional-dependencies]
test = [
    "pytest",
    "coverage==7.16.2",
    "pytest-cov==7.1.0",
    "mypy",
    "ruff",
]

dev = [
    "mypy",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "platform: Platform validation tests",
    "spark: Spark validation tests",
]

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
